spring.application.name=portal-tramites-backend
server.port=8080

# ---- MySQL: portal_tramites_db (esquema gestionado por bd/bd_tramites.sql) ----
spring.datasource.url=jdbc:mysql://localhost:3306/portal_tramites_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=${DB_USER:root}
# No commitear credenciales: definir la variable de entorno DB_PASSWORD
spring.datasource.password=${DB_PASSWORD:}

# El esquema lo mantiene el script SQL; JPA solo lee
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=false

spring.jackson.serialization.fail-on-empty-beans=false
