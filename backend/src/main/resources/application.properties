spring.application.name=portal-tramites-backend
# Port del contenedor/plataforma (Azure/Render inyectan PORT); local: 8080
server.port=${PORT:8080}

# ---- Variables de entorno: credenciales en backend/.env.local (ignorado por git) ----
# Carga opcional: si el archivo no existe, no falla (las vars tambien pueden
# definirse en el entorno del sistema o pasarse por linea de comandos).
spring.config.import=optional:file:.env.local[.properties],optional:file:./backend/.env.local[.properties]

# ---- MySQL: local (portal_tramites_db) o en la nube, ej. Aiven ----
# Los valores vienen de backend/.env.local (ver plantilla backend/.env);
# sin variables definidas se usan los defaults de abajo (MySQL local).
# En la nube DB_SSL_PARAMS debe activar TLS (Aiven exige sslMode=REQUIRED,
# ver OPCION B del molde .env), y el esquema va en la BD remota.
spring.datasource.url=jdbc:mysql://${DB_HOST:}:${DB_PORT:}/${DB_NAME:}?serverTimezone=America/Lima&${DB_SSL_PARAMS:useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}

# ---- DeepGram: búsqueda por voz (modelo Nova, español latinoamericano) ----
# La API key se define en backend/.env.local (ver backend/.env como plantilla).
deepgram.api-key=${DEEPGRAM_API_KEY:}
deepgram.model=${DEEPGRAM_MODEL:nova-3}
deepgram.language=${DEEPGRAM_LANGUAGE:es-419}

# El esquema lo mantiene el script SQL; JPA solo lee
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=false

spring.jackson.serialization.fail-on-empty-beans=false

# ---- Compresion HTTP (gzip) para JSON: agiliza respuestas grandes ----
# (listado de ~275 tramites) cuando el backend o la BD estan en la nube.
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=2048
